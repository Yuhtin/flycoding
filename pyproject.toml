[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flycoding"
version = "0.1.0"
description = "The new era of vibe coding: a simulated fly brain picks prompts for OpenCode or Codex."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "Pillow>=10.0",
  "pyarrow>=17.0",
]

[project.scripts]
flycoding = "flycodex.cli:main"
flycodex = "flycodex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/flycodex"]

[dependency-groups]
dev = ["pytest>=8.0"]
